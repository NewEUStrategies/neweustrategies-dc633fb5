name: Scheduler (push / digesty / przypomnienia)

# Harmonogram doręczeń po stronie REPO - siatka bezpieczeństwa dla kolejki push,
# digestów e-mail, przypomnień o wydarzeniach i follow-upów CRM.
#
# Dlaczego istnieje: dyspozytor (src/lib/notifications/dispatch.server.ts) jest
# kompletny, ale sam siebie nie woła. Ścieżką podstawową jest pg_cron + pg_net
# (co minutę -> /api/public/jobs-tick), tylko że jest bezużyteczna, dopóki
# job_runner_settings ma domyślne enabled=false / base_url='' - i dokładnie tak
# wyglądała produkcja: cron tykał w próżnię, kolejka rosła. Ten workflow:
#
#   * drenuje kolejki niezależnie od stanu bazy (sekret w repo, nie w DB),
#   * UZBRAJA ścieżkę podstawową - pierwszy tick przekazuje bazie publiczny
#     origin (arm_job_runner), więc pg_cron zaczyna działać sam,
#   * daje widoczny w repo dowód, że doręczenia biegły (step summary + czerwony
#     przebieg, gdy endpoint odpowiada błędem).
#
# Konfiguracja (Settings -> Secrets and variables -> Actions):
#   variables.APP_BASE_URL          np. https://neweuropeanstrategies.com
#   secrets.COMMUNITY_CRON_SECRET   = env COMMUNITY_CRON_SECRET aplikacji ALBO
#                                     job_runner_settings.secret (oba działają)
#                                     - przebiegi 5-minutowe (community-cron).
#                                     Sekret runnera NIE otwiera rozliczeń.
#   secrets.BILLING_CRON_SECRET     = env BILLING_CRON_SECRET aplikacji ALBO
#                                     job_runner_settings.billing_secret -
#                                     WYŁĄCZNIE dobowy przebieg rozliczeń
#                                     (billing-cron). Endpoint przyjmuje tylko
#                                     te dwa sekrety (PAY-17a): ani sekretu
#                                     społeczności, ani sekretu runnera
#                                     (job_runner_settings.secret), a wartość
#                                     równą COMMUNITY_CRON_SECRET odrzuca jako
#                                     błąd konfiguracji. Nigdy nie wpisuj tu
#                                     sekretu społeczności ani runnera.
#   variables.SCHEDULER_BACKUP      = off - JAWNA decyzja właściciela, że repo
#                                     nie prowadzi drugiej linii doręczeń
#                                     z harmonogramu (zostaje pg_cron):
#                                     przebiegi `schedule` pomijają ticki bez
#                                     ostrzeżeń, audyt dobowy tylko odnotowuje.
#                                     Ręczne uruchomienie (workflow_dispatch)
#                                     to jawne polecenie operatora i biegnie
#                                     jak bez wyłącznika: ticki, a bez
#                                     konfiguracji zwykłe ostrzeżenie.
#
# STAN KONFIGURACJI JEST JAWNY (audyt ED14). Do 2026-10 nieskonfigurowany
# scheduler kończył każdy przebieg zielono z ostrzeżeniem, więc repo
# deklarowało drugą linię doręczeń, której produkcja nie miała. Teraz:
#   * przebieg 5-minutowy bez sekretu swojego zakresu - ostrzeżenie i pominięte
#     ticki (fork i świeży klon nie hałasują, przebiegi nie zalewają skrzynki),
#   * przebieg dobowy (25 5 * * *) - krok „Audyt drugiej linii doręczeń": brak
#     APP_BASE_URL, COMMUNITY_CRON_SECRET albo BILLING_CRON_SECRET bez decyzji
#     SCHEDULER_BACKUP=off to CZERWONY przebieg raz na dobę.
#
# AKCJE PRZYPIĘTE DO SHA COMMITA (PAY-17b, przegląd 3.6/7.10). Krok „Tick
# rozliczeń" uruchamia skrypt z katalogu roboczego z BILLING_CRON_SECRET w env;
# przesunięty tag `actions/checkout` podmieniłby ten skrypt bez śladu w repo.
#
# Uwaga operacyjna: harmonogram GitHub Actions jest best-effort. Wpis
# 5-minutowy (288 przebiegów na dobę) dał na repo właściciela około 10
# przebiegów na dobę (pomiar audytu ED14, 2026-10-17) - to NIE jest drenaż co
# 5 minut, tylko siatka bezpieczeństwa o rozdzielczości godzin. GitHub wyłącza
# też zaplanowane workflow po 60 dniach braku aktywności w repo. Ścieżką
# podstawową i siatką co 5 minut jest pg_cron (docs/RUNBOOK_COMMUNITY.md §2).

on:
  schedule:
    # Co 5 minut (minimalna granulacja Actions), z pominięciem pełnej godziny -
    # GitHub opóźnia i zrzuca przebiegi w szczycie na początku godziny. Jeden
    # przebieg = 4 ticki po 60 s.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
    # Dobowe przypomnienia rozliczeniowe (godzinę po wpisie pg_cron; wysyłka jest
    # idempotentna per subskrypcja i data graniczna, więc dublowanie jest bezpieczne).
    - cron: "25 5 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Zakres ticku
        required: false
        default: all
        type: choice
        options:
          - all
          - push
          - digest-daily
          - digest-weekly
          - event-reminders
          - crm-task-reminders
          # Bilety z kodem QR (decyzje organizatora, kaskada grupy, ponowienia)
          # - ten sam krok biegnie co minutę w jobs-tick; tu do ręcznego wypchnięcia.
          - event-ticket-codes
          - event-participant-reminders
          - event-ticket-lifecycle
          - event-follow-up
          # Przepustki Google Wallet unieważnionych biletów -> INACTIVE (OPS-14);
          # ten sam krok biegnie co minutę w jobs-tick.
          - event-wallet-passes
          # Hub „Przychód i lejek" (I9): silnik ścieżek i skanery S2 - biegną
          # w jobs-tick (co minutę / co 5 minut); tu do ręcznego wypchnięcia.
          - journeys
          - revenue-lifecycle
          - billing
      ticks:
        description: Liczba ticków w przebiegu (1-10)
        required: false
        default: "1"
        type: string

# Kolejne przebiegi NIE kasują trwających: przerwany tick w połowie partii
# oddaje pracę do kolejki z backoffem, czyli opóźnia doręczenia.
concurrency:
  group: scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: Tick doręczeń
    # Fork nie wysyła ruchu na produkcję właściciela; ręczne uruchomienie z forka
    # nadal działa po ustawieniu własnych zmiennych.
    if: github.event_name != 'schedule' || github.repository_owner == 'NewEUStrategies'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Zakres i liczba ticków zależą od wyzwalacza: wpis dobowy obsługuje
      # rozliczenia, wpis 5-minutowy drenuje kanały społeczności. Zakres jest
      # ustalany PRZED kontrolą konfiguracji, bo od niego zależy, który sekret
      # jest wymagany.
      - name: Ustal zakres ticku
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_TICKS: ${{ inputs.ticks }}
        run: |
          job="all"; ticks="4"; endpoint="/api/public/community-cron"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            job="${INPUT_JOB:-all}"
            ticks="${INPUT_TICKS:-1}"
          elif [ "$SCHEDULE" = "25 5 * * *" ]; then
            job="billing"
            ticks="1"
          fi
          if [ "$job" = "billing" ]; then
            endpoint="/api/public/billing-cron"
            job="all"
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "ticks=$ticks" >> "$GITHUB_OUTPUT"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      # Bez `bun install` i bez build-stepu: sterownik ticku to czysty Node 18+
      # (globalne fetch), więc przebieg kosztuje sekundy, nie minuty. Kontrola
      # widzi wyłącznie OBECNOŚĆ sekretów (`!= ''`), nie ich wartości.
      - name: Sprawdź konfigurację
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          BACKUP_MODE: ${{ vars.SCHEDULER_BACKUP }}
          BASE_URL: ${{ vars.APP_BASE_URL }}
          ENDPOINT: ${{ steps.plan.outputs.endpoint }}
          HAS_COMMUNITY_SECRET: ${{ secrets.COMMUNITY_CRON_SECRET != '' }}
          HAS_BILLING_SECRET: ${{ secrets.BILLING_CRON_SECRET != '' }}
        run: |
          # Jawna decyzja właściciela wyłącza WYŁĄCZNIE przebiegi z harmonogramu:
          # bez ticków i bez ostrzeżeń co przebieg. Ręczny workflow_dispatch
          # (ręczne wypchnięcie z runbooków) to jawne polecenie operatora -
          # biegnie jak bez wyłącznika: ticki albo zwykłe ostrzeżenie niżej.
          if [ "$BACKUP_MODE" = "off" ] && [ "$EVENT" = "schedule" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Druga linia doręczeń wyłączona (vars.SCHEDULER_BACKUP=off) - ticki pominięte."
            exit 0
          fi
          if [ "$ENDPOINT" = "/api/public/billing-cron" ]; then
            has_secret="$HAS_BILLING_SECRET"
            secret_name="secrets.BILLING_CRON_SECRET"
            scope="przypomnienia rozliczeniowe i zamiatarka płatności nie biegną z repo"
          else
            has_secret="$HAS_COMMUNITY_SECRET"
            secret_name="secrets.COMMUNITY_CRON_SECRET"
            scope="kolejka push i digesty nie są drenowane z repo"
          fi
          if [ -z "$BASE_URL" ] || [ "$has_secret" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # Ręczny przebieg przy włączonym wyłączniku: decyzja już zapisana.
            hint=" Brak drugiej linii jako decyzję zapisz w vars.SCHEDULER_BACKUP=off."
            if [ "$BACKUP_MODE" = "off" ]; then hint=""; fi
            echo "::warning title=Scheduler nieskonfigurowany::Ustaw variables.APP_BASE_URL oraz $secret_name - $scope.$hint"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Dwa kroki zamiast jednego z wyrażeniem `a && b || c`: każdy endpoint
      # dostaje WYŁĄCZNIE swój sekret, a pusty sekret rozliczeń nigdy nie
      # „spada" na sekret społeczności.
      - name: Tick
        if: steps.cfg.outputs.configured == 'true' && steps.plan.outputs.endpoint != '/api/public/billing-cron'
        env:
          SCHEDULER_BASE_URL: ${{ vars.APP_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.COMMUNITY_CRON_SECRET }}
          SCHEDULER_ENDPOINT: ${{ steps.plan.outputs.endpoint }}
          SCHEDULER_JOB: ${{ steps.plan.outputs.job }}
          SCHEDULER_TICKS: ${{ steps.plan.outputs.ticks }}
          SCHEDULER_SOURCE: github_actions
          SCHEDULER_INTERVAL_MS: "60000"
          # Poniżej interwału crona (5 min), żeby przebiegi nie zachodziły.
          SCHEDULER_DEADLINE_MS: "240000"
        run: node scripts/scheduler-tick.mjs

      - name: Tick rozliczeń
        if: steps.cfg.outputs.configured == 'true' && steps.plan.outputs.endpoint == '/api/public/billing-cron'
        env:
          SCHEDULER_BASE_URL: ${{ vars.APP_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
          SCHEDULER_ENDPOINT: ${{ steps.plan.outputs.endpoint }}
          SCHEDULER_JOB: ${{ steps.plan.outputs.job }}
          SCHEDULER_TICKS: ${{ steps.plan.outputs.ticks }}
          SCHEDULER_SOURCE: github_actions
          SCHEDULER_INTERVAL_MS: "60000"
          SCHEDULER_DEADLINE_MS: "240000"
          # Ten sam termin co pg_net w invoke_billing_cron i
          # BILLING_CRON_CALLER_TIMEOUT_MS w billing-cron.ts: zamiatarka po
          # przypomnieniach planuje pracę do tej chwili (przegląd 3.0).
          SCHEDULER_TIMEOUT_MS: "60000"
        run: node scripts/scheduler-tick.mjs

      # Sonda zdrowia po tickach: jeśli kolejka mimo drenażu stoi (brak VAPID,
      # martwy runner bazy), zostawiamy ostrzeżenie w podsumowaniu przebiegu.
      # Tylko przy przebiegach społeczności - dobowy przebieg rozliczeń nie ma
      # (i nie powinien mieć) sekretu społeczności.
      - name: Sonda zdrowia harmonogramu
        if: steps.cfg.outputs.configured == 'true' && steps.plan.outputs.endpoint != '/api/public/billing-cron'
        continue-on-error: true
        env:
          SCHEDULER_BASE_URL: ${{ vars.APP_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.COMMUNITY_CRON_SECRET }}
        run: |
          body="$(curl -sS --max-time 20 \
            -H "x-community-cron-secret: $SCHEDULER_SECRET" \
            "${SCHEDULER_BASE_URL%/}/api/public/community-cron" || echo '{"ok":null}')"
          echo "### Zdrowie harmonogramu" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          case "$body" in
            *'"ok":false'*)
              echo "::warning title=Harmonogram zgłasza zastój::Sonda GET /api/public/community-cron zwróciła ok=false - sprawdź panel /admin/community/notifications." ;;
          esac

      # Audyt drugiej linii doręczeń - raz na dobę, w przebiegu rozliczeń (także
      # po czerwonym ticku). Repo deklaruje zapasową linię; bez konfiguracji
      # i bez jawnej decyzji `vars.SCHEDULER_BACKUP=off` przebieg jest czerwony.
      # Sprawdza KOMPLET (oba zakresy), widzi wyłącznie obecność sekretów.
      - name: Audyt drugiej linii doręczeń
        if: ${{ !cancelled() && github.event.schedule == '25 5 * * *' }}
        env:
          BACKUP_MODE: ${{ vars.SCHEDULER_BACKUP }}
          BASE_URL: ${{ vars.APP_BASE_URL }}
          HAS_COMMUNITY_SECRET: ${{ secrets.COMMUNITY_CRON_SECRET != '' }}
          HAS_BILLING_SECRET: ${{ secrets.BILLING_CRON_SECRET != '' }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$BACKUP_MODE" = "off" ]; then
            echo "::notice title=Druga linia doręczeń wyłączona::vars.SCHEDULER_BACKUP=off - decyzja właściciela; doręczenia zależą wyłącznie od pg_cron (jobs-tick co minutę, community-cron co 5 minut)."
            echo "### Druga linia doręczeń: wyłączona decyzją (vars.SCHEDULER_BACKUP=off)" >> "$summary"
            exit 0
          fi
          missing=""
          [ -n "$BASE_URL" ] || missing="$missing variables.APP_BASE_URL"
          [ "$HAS_COMMUNITY_SECRET" = "true" ] || missing="$missing secrets.COMMUNITY_CRON_SECRET"
          [ "$HAS_BILLING_SECRET" = "true" ] || missing="$missing secrets.BILLING_CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error title=Druga linia doręczeń nie istnieje::Brak:$missing. Ustaw je albo zapisz decyzję vars.SCHEDULER_BACKUP=off (docs/RUNBOOK_COMMUNITY.md §2)."
            echo "### Druga linia doręczeń: NIESKONFIGUROWANA - brak:$missing" >> "$summary"
            exit 1
          fi
          echo "### Druga linia doręczeń: skonfigurowana" >> "$summary"

      # Warmer NES Edge Cache: kluczowe dokumenty publiczne (/, /en, /blog,
      # /en/blog) są odpytywane w rytmie ticków, więc okno świeżości (180 s)
      # praktycznie nie wygasa i realny czytelnik nie płaci pełnego renderu SSR
      # (MISS = sekundy TTFB na zimnej kolonii). Best-effort: skrypt zawsze
      # kończy się kodem 0 - grzanie nigdy nie zapala crona doręczeń. Wymaga
      # tylko APP_BASE_URL (bez sekretu - to anonimowe GET-y dokumentów).
      - name: Warm NES Edge Cache
        if: github.event.schedule != '25 5 * * *'
        continue-on-error: true
        env:
          # Domyślnie produkcja: rozgrzewka to anonimowe GET-y dokumentów, więc nie
          # potrzebuje sekretu ani konfiguracji (wcześniej bez zmiennej krok był no-opem).
          # Job i tak biegnie z harmonogramu tylko w repo właściciela (warunek wyżej).
          WARM_BASE_URL: ${{ vars.APP_BASE_URL || 'https://neweuropeanstrategies.com' }}
          # 2 ticki co 2 min: krok mieści się w budżecie joba (timeout 8 min
          # po ticku doręczeń ~4 min), a STALE i tak serwuje natychmiast -
          # celem warmera jest wyłącznie eliminacja pełnych MISS-ów.
          WARM_TICKS: "2"
          WARM_INTERVAL_MS: "120000"
        run: node scripts/warm-edge-cache.mjs
