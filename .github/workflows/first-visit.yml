name: First visit on production artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: first-visit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sequential measurements on ONE runner avoid comparing different CPUs.
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install candidate dependencies and the common browser
        run: |
          cd candidate
          bun install --frozen-lockfile
          cd ..
          ln -s ../candidate/node_modules harness/node_modules
          cd harness
          bunx playwright install --with-deps chromium
      - name: Build baseline
        working-directory: baseline
        run: |
          bun install --frozen-lockfile
          bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Measure baseline with the same content and interaction assertions
        working-directory: harness
        run: bun run test:e2e:performance
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/baseline
          NES_PERFORMANCE_BASELINE: "1"
      - name: Upload baseline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-visit-baseline
          path: |
            harness/reports/first-visit/
            harness/reports/first-visit-playwright.json
            harness/test-results-performance/
          retention-days: 14
      - name: Build candidate
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Gate candidate paint, layout and first interaction
        if: ${{ !cancelled() }}
        working-directory: harness
        run: |
          rm -rf reports/first-visit
          bun run test:e2e:performance
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/candidate
          NES_PERFORMANCE_BASELINE: "0"
      - name: Upload candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-visit-candidate
          path: |
            harness/reports/first-visit/
            harness/reports/first-visit-playwright.json
            harness/test-results-performance/
          retention-days: 14
