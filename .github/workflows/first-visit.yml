name: First visit on production artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: first-visit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Build both artifacts first, then alternate equivalent cases on ONE runner.
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install candidate dependencies and the common browser
        run: |
          cd candidate
          bun install --frozen-lockfile
          cd ..
          ln -s ../candidate/node_modules harness/node_modules
          cd harness
          bunx playwright install --with-deps chromium
      - name: Verify the measurement and comparison contract
        working-directory: harness
        run: node --test scripts/performance/first-visit-harness.test.mjs
      - name: Build baseline
        working-directory: baseline
        run: |
          bun install --frozen-lockfile
          bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Build candidate
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Measure paired baseline and candidate samples
        working-directory: harness
        run: node scripts/performance/run-first-visit.mjs --compare ../baseline ../candidate
      - name: Gate cold entry across public platform catalogs
        if: ${{ !cancelled() }}
        working-directory: harness
        run: node scripts/performance/run-platform-cold-start.mjs
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/candidate
          NES_PERFORMANCE_BASELINE: "0"
      - name: Compare equivalent cold and warm samples
        working-directory: harness
        run: bun run check:first-visit-regression
      - name: Upload baseline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-visit-baseline
          path: |
            harness/reports/first-visit-baseline/
            harness/reports/first-visit-playwright/baseline-*.json
            harness/test-results-performance/baseline-*/
          retention-days: 14
      - name: Upload candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-visit-candidate
          path: |
            harness/reports/first-visit/
            harness/reports/first-visit-comparison.json
            harness/reports/first-visit-playwright/
            harness/test-results-performance/
          retention-days: 14
