name: First visit on production artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: first-visit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: artifact
          ref: ${{ matrix.version == 'baseline' && (github.event.pull_request.base.sha || github.event.before) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install locked dependencies
        working-directory: artifact
        run: bun install --frozen-lockfile
      - name: Build the actual version under comparison
        working-directory: artifact
        run: bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
          VITE_SUPABASE_ANON_KEY: performance-fixture
      - name: Prepare the same browser and fixtures for both versions
        run: |
          ln -s ../artifact/node_modules harness/node_modules
          cd harness
          bunx playwright install --with-deps chromium
      - name: Measure content, paint and an actual first interaction
        working-directory: harness
        run: bun run test:e2e:performance
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/artifact
          # The old version is measured, the candidate is a blocking budget.
          # Both must render content, hydrate and handle the same click.
          NES_PERFORMANCE_BASELINE: ${{ matrix.version == 'baseline' && '1' || '0' }}
      - name: Upload measurements and visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-visit-${{ matrix.version }}
          path: |
            harness/reports/first-visit/
            harness/reports/first-visit-playwright.json
            harness/test-results-performance/
          retention-days: 14
