name: Rozliczenia (nocna sonda odnowienia i dunningu)

# Odnowienie subskrypcji i ścieżka nieudanej płatności to jedyne części lejka,
# których nie da się sprawdzić klikając checkout. Przebieg przesuwa Test Clock
# w sandboxie Stripe, ODPYTUJE go do skutku i weryfikuje, że powstała nowa
# faktura cykliczna, okres poszedł do przodu, a stan faktury jest spójny ze
# stanem subskrypcji. Potem sprawdza NASZĄ stronę: dziennik webhooków ma
# przetworzone zdarzenie `subscription.*` tej subskrypcji (i żadnej porażki)
# z okna po zbrojeniu, a wiersz `subscriptions` ma przesunięty okres.
# Sprawdza też, czy punkt odbioru webhooków piaskownicy subskrybuje KAŻDY typ
# zdarzenia, który integracja obsługuje (STRIPE_WEBHOOK_EVENT_TYPES) - brak
# np. `charge.dispute.closed` nie wywraca żadnego testu, a spór wygrany nie
# przywraca wtedy dostępu (przegląd 7.12).
#
# HISTORIA TEGO PLIKU (nie usuwać - to uzasadnienie trybu ścisłego):
# do 2026-08 job eksportował sekret pod nazwą poprzedniego operatora płatności,
# podczas gdy sonda czytała STRIPE_SANDBOX_API_KEY. Skutek: co dobę 40 minut
# `sleep`, zielony wynik i zero żądań do operatora. Dlatego przebieg
# z harmonogramu działa teraz w trybie ścisłym - pominięta weryfikacja jest
# BŁĘDEM, a nie ostrzeżeniem.
#
# Konfiguracja (Settings -> Secrets and variables -> Actions):
#   secrets.STRIPE_SANDBOX_API_KEY            - kroki sondy (arm, wait, verify)
#   secrets.LOVABLE_API_KEY                   - kroki sondy (arm, wait, verify)
#   secrets.PROBE_SUPABASE_URL                - WYŁĄCZNIE krok weryfikacji:
#                                               adres projektu Supabase wdrożenia,
#                                               do którego Stripe sandbox wysyła
#                                               webhooki
#   secrets.PROBE_SUPABASE_PUBLISHABLE_KEY    - WYŁĄCZNIE krok weryfikacji:
#                                               klucz PUBLIKOWALNY (anon) tego
#                                               projektu - ten sam, który dostaje
#                                               przeglądarka
#   secrets.BILLING_PROBE_TOKEN               - WYŁĄCZNIE krok weryfikacji: token
#                                               sondy z `SELECT public.
#                                               billing_probe_rotate_token();`
#                                               (w bazie leży tylko jego skrót)
#   vars.APP_BASE_URL                         - adres wdrożenia; zawęża kontrolę
#                                               punktu odbioru webhooków do tego
#                                               wdrożenia (bez niej: każdy punkt
#                                               z naszą ścieżką)
#   vars.BILLING_PROBE_DISABLED = 1           - JAWNA decyzja właściciela, że
#                                               sonda nie biegnie (job pominięty);
#                                               jedyna droga do zieleni bez
#                                               kompletu sekretów
#
# Krok „Sprawdź konfigurację sondy" wypisuje KOMPLET brakujących sekretów
# jednym błędem, zanim sonda cokolwiek zrobi.
#
# BEZ KLUCZA `service_role` (przegląd 7.6). Sonda czytała dwie tabele kluczem
# `service_role` PRODUKCJI - kluczem, który omija RLS w całej bazie, a sekret
# repozytorium czyta każdy workflow wypchnięty na gałąź. Teraz klucz
# publikowalny otwiera wyłącznie RPC `billing_probe_status`, a ta po
# sprawdzeniu tokenu zwraca tylko pola sondy z PIASKOWNICY jednej subskrypcji.
# Sekret `PROBE_SUPABASE_SERVICE_ROLE_KEY` usuń z ustawień repozytorium.
#
# SEKRETY SĄ W ENV KROKÓW, NIE JOBA. Env joba widzi każdy krok, także akcje
# zewnętrzne (`oven-sh/setup-bun`, `actions/upload-artifact`) - token sondy
# nie ma czego szukać w kodzie instalatora Buna. Z tego samego powodu akcje
# są przypięte do SHA commita, a nie do tagu: przesunięty tag podmieniłby kod
# uruchamiany obok sekretów bez śladu w repo.
#
# UWAGA (naprawa 06.08): workflow eksportował `PADDLE_SANDBOX_API_KEY`, a skrypt
# czyta `STRIPE_SANDBOX_API_KEY` od czasu migracji na Stripe. `keys()` zwracało
# więc zawsze null i przebieg kończył się ZIELONO po 40 minutach snu - „sonda
# nieskonfigurowana" była nieodróżnialna od „rozliczenia działają". Dlatego:
#   * nazwa sekretu zgodna ze skryptem,
#   * na przebiegu z HARMONOGRAMU brak sekretów jest BŁĘDEM (PROBE_REQUIRE_CONFIG),
#     bo cicho wyłączona jedyna weryfikacja odnowienia jest gorsza niż czerwony job;
#     dotyczy to także dostępu do naszej bazy w kroku weryfikacji; ręczne
#     uruchomienie (fork, świeży klon) nadal tylko ostrzega,
#   * ślepy `sleep` zastąpiony odpytywaniem Test Clocka - przebieg kończy się,
#     gdy Stripe skończy przeliczać, zamiast palić 40 minut runnera codziennie.

on:
  schedule:
    # 02:40 UTC - poza godzinami szczytu Actions.
    - cron: "40 2 * * *"
  workflow_dispatch:

concurrency:
  group: billing-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renewal:
    name: Odnowienie i dunning (środowisko testowe)
    # Wyłącznik jest JAWNY (repository variable), bo alternatywa - cicha zielona
    # sonda przy braku sekretów - jest dokładnie tym, co ten plik naprawia.
    if: >-
      vars.BILLING_PROBE_DISABLED != '1' &&
      (github.event_name != 'schedule' || github.repository_owner == 'NewEUStrategies')
    runs-on: ubuntu-latest
    # Czekanie na Test Clock jest odpytywaniem z twardym terminem
    # (PROBE_WAIT_TIMEOUT_MS = 20 min), a nasza strona jest odpytywana najwyżej
    # 3 minuty, więc typowy przebieg trwa minuty. Limit joba jest zapasem nad
    # tymi terminami, nie planowanym czasem trwania.
    timeout-minutes: 30
    # Wyłącznie konfiguracja bez sekretów - sekrety są w env kroków niżej.
    env:
      PROBE_WAIT_TIMEOUT_MS: "1200000"
      PROBE_STATE_FILE: ${{ github.workspace }}/billing-renewal-probe.json
      # Nocny przebieg to monitoring produkcyjny - brak sekretów ma być czerwony.
      PROBE_REQUIRE_CONFIG: ${{ github.event_name == 'schedule' }}
    steps:
      # KOMPLET konfiguracji sprawdzany RAZ, przed checkoutem i Bunem (audyt
      # ED14). Sonda była czerwona co dobę co najmniej od 2026-09-17 na braku
      # dwóch pierwszych kluczy, a po ich dodaniu padłaby dopiero następnej
      # nocy - na trzech sekretach kroku weryfikacji. Teraz jeden błąd z pełną
      # listą. Krok widzi wyłącznie OBECNOŚĆ sekretów (`!= ''`), nie wartości.
      - name: Sprawdź konfigurację sondy
        env:
          HAS_STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY != '' }}
          HAS_LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY != '' }}
          HAS_PROBE_SUPABASE_URL: ${{ secrets.PROBE_SUPABASE_URL != '' }}
          HAS_PROBE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROBE_SUPABASE_PUBLISHABLE_KEY != '' }}
          HAS_BILLING_PROBE_TOKEN: ${{ secrets.BILLING_PROBE_TOKEN != '' }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          missing=""
          for name in STRIPE_SANDBOX_API_KEY LOVABLE_API_KEY PROBE_SUPABASE_URL PROBE_SUPABASE_PUBLISHABLE_KEY BILLING_PROBE_TOKEN; do
            has="HAS_$name"
            [ "${!has}" = "true" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "### Sonda rozliczeń: konfiguracja kompletna" >> "$summary"
            exit 0
          fi
          echo "### Sonda rozliczeń: brak sekretów -$missing" >> "$summary"
          if [ "$PROBE_REQUIRE_CONFIG" = "true" ]; then
            echo "::error title=Sonda rozliczeń nieskonfigurowana::Brak sekretów repozytorium:$missing. Ustaw je (Settings -> Secrets and variables -> Actions) albo zapisz decyzję vars.BILLING_PROBE_DISABLED=1."
            exit 1
          fi
          echo "::warning title=Sonda rozliczeń nieskonfigurowana::Brak sekretów repozytorium:$missing - przebieg ręczny tylko ostrzega."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Przesuń Test Clock za koniec okresu
        id: arm
        env:
          STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: bun scripts/billing-renewal-probe.ts arm

      # Odpytywanie Test Clocka z warunkiem wyjścia (sufit 20 min =
      # PROBE_WAIT_TIMEOUT_MS, próby co 5 s z łagodnym backoffem do 30 s).
      - name: Poczekaj na naliczenie
        if: steps.arm.outputs.outcome == 'armed'
        env:
          STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: bun scripts/billing-renewal-probe.ts wait

      - name: Zweryfikuj odnowienie, dunning i naszą stronę
        if: steps.arm.outputs.outcome == 'armed'
        env:
          STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          PROBE_SUPABASE_URL: ${{ secrets.PROBE_SUPABASE_URL }}
          PROBE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROBE_SUPABASE_PUBLISHABLE_KEY }}
          BILLING_PROBE_TOKEN: ${{ secrets.BILLING_PROBE_TOKEN }}
          PROBE_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: bun scripts/billing-renewal-probe.ts verify

      - name: Zachowaj raport sondy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: billing-renewal-probe
          path: reports/billing-renewal-probe.json
          if-no-files-found: ignore
