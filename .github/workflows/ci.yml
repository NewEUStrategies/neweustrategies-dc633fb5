name: CI

# TYMCZASOWA GAŁĄŹ DIAGNOSTYCZNA (nie scalać): krótki log z pełnym wyjściem
# `check:bundle` na runnerze. Na main ten krok jest w środku ~10 000 linii logu.
on:
  workflow_dispatch:

env:
  TZ: UTC

jobs:
  bundle-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies
        run: bun install --frozen-lockfile > install.log 2>&1 || (tail -40 install.log; exit 1)
      - name: Build
        run: bun run build > build.log 2>&1 || (tail -80 build.log; exit 1)
      - name: Bundle size budget
        run: bun run check:bundle || true
      - name: Worker and CSS sizes
        run: |
          cd .output/public/assets
          for f in *worker*.js *.css; do echo "$f raw=$(wc -c < "$f") gzip6=$(gzip -6c "$f" | wc -c)"; done
