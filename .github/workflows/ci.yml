name: CI

# Zestaw bramek CI ograniczony do tego, co chroni produkcję (2026-10-05).
#
# Na każdym PR i każdym pushu do main jadą wyłącznie:
#   verify      - formatowanie, typy, lint i tanie bramki statyczne, które
#                 pilnują izolacji tenantów, migracji, RPC i XSS (sekundy),
#   test-shards - pełna suita vitest w czterech shardach, BEZ instrumentacji
#                 coverage (pokrycie nie jest bramką; `bun run test:coverage`
#                 liczy je lokalnie z jednym progiem globalnym),
#   build       - build produkcyjny, acykliczność grafu chunków i test startu
#                 artefaktu w przeglądarce,
#   pgtap, pg-harness - polityki RLS, role i migracje na żywym PostgreSQL.
# `Required release checks` agreguje te joby w jeden wymagany status.
#
# Budżety wydajności (rozmiar bundla, czystość ścieżki startowej) jadą tylko
# na main i na żądanie (workflow_dispatch) - nie blokują PR-ów. Pomiary A/B
# (first-visit, Lighthouse, widgety CMS) mają własne workflowy, uruchamiane
# po scaleniu do main albo ręcznie.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Date-sensitive fixtures use a fixed runner timezone; public render tests
# independently verify Europe/Warsaw formatting and SSR/client parity.
env:
  TZ: UTC

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Wersje Node i Buna mają JEDNO źródło dla wszystkich workflowów:
      # `.node-version` i `.bun-version` w korzeniu repo. Podbicie to zmiana
      # jednego pliku, a nie kilkunastu kroków, które trzeba było podbijać
      # równo. `bun.lock` zostaje przy `lockfileVersion: 1` - Bun 1.4 pisze v2
      # wyłącznie przy świeżym lockfile'u, więc lockfile'a nie usuwamy.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Każdy krok poniżej jedzie także wtedy, gdy poprzedni padł, żeby jeden
      # przebieg pokazał wszystkie problemy naraz.
      - name: Format (prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: SQL migration replay safety
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-migration-replay

      - name: Arbitrzy onConflict (upsert ⇄ klucze unikalne migracji)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:on-conflict-arbiters

      - name: SQL tenant-scope invariant
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-tenant-scope

      - name: SQL policy tenant-binding regression
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-policy-tenant-regression

      - name: SQL owner tenant-scope invariant
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-owner-tenant-scope

      - name: SQL anon-insert invariant
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-anon-insert

      - name: DEFINER views read-only for clients (both migration lanes)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-definer-views

      - name: Migration lanes (supabase/migrations is the source; drizzle mirror is generated and fresh)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:migration-lanes

      # Niezmienność migracji: scalone pliki obu pasów, snapshoty i wpisy
      # `_journal.json` nie znikają i nie zmieniają się (wyjątki:
      # MIGRATION_EDIT_ALLOWLIST). Baza porównania: na PR - SHA bazy PR; na
      # main - ostatni commit main, na którym ta bramka PRZESZŁA (zapamiętany
      # w pamięci podręcznej Actions krokami niżej), a bez niego
      # `github.event.before`. Commit bota (rewert, edycja wpisu) trafia na main
      # bez PR-a: porównanie z `github.event.before` byłoby alarmem jednego
      # przebiegu, a przebieg anulowany przez nowszy push (concurrency wyżej)
      # nie zgłosiłby niczego. Z bazą „ostatni zielony" czerwień trwa przy
      # każdym kolejnym pushu, aż naprawa trafi na main, a anulowany przebieg
      # niczego nie zapamiętuje - dlatego concurrency może dalej anulować
      # starsze przebiegi main. Checkout zostaje płytki (depth 1): diff dwóch
      # drzew nie potrzebuje historii, wystarczy dociągnąć jeden commit bazy.
      # MIGRATION_IMMUTABILITY_REQUIRE_BASE=1: niedostępna baza to błąd, nie
      # ostrzeżenie - pominięte porównanie nie może wyglądać jak zielone.
      # Zapamiętujemy wyłącznie przebieg z prawdziwą bazą (`compared`), nigdy
      # porównanie HEAD z samym sobą (workflow_dispatch bez zapamiętanej bazy).
      - name: Restore the last main commit that passed migration immutability
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/migration-immutability/last-ok
          key: migration-immutability-ok-${{ github.sha }}
          restore-keys: migration-immutability-ok-

      - name: Migration immutability (merged migrations and journal entries are append-only)
        id: immutability
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LAST_OK: ${{ runner.temp }}/migration-immutability/last-ok
          MIGRATION_IMMUTABILITY_REQUIRE_BASE: "1"
        run: |
          base="$EVENT_BASE"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -s "$LAST_OK" ]; then
            base="$(cat "$LAST_OK")"
            echo "Baza porównania: ostatni commit main z zieloną bramką niezmienności ($base)."
          fi
          case "$base" in
            "" | 0000000000000000000000000000000000000000) ;;
            *)
              git fetch --no-tags --depth=1 origin "$base" || echo "::warning::Nie udało się pobrać commitu bazy $base."
              echo "compared=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          MIGRATION_IMMUTABILITY_BASE="$base" bun run check:migration-immutability

      - name: Remember this main commit as the migration immutability base
        if: ${{ !cancelled() && steps.immutability.outcome == 'success' && steps.immutability.outputs.compared == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          LAST_OK: ${{ runner.temp }}/migration-immutability/last-ok
        run: |
          mkdir -p "$(dirname "$LAST_OK")"
          echo "$GITHUB_SHA" > "$LAST_OK"

      - name: Save the migration immutability base
        if: ${{ !cancelled() && steps.immutability.outcome == 'success' && steps.immutability.outputs.compared == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/migration-immutability/last-ok
          key: migration-immutability-ok-${{ github.sha }}

      - name: SQL app_role literal invariant
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:sql-app-role

      - name: RPC contract (client calls ⇄ migrations)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:rpc-contract

      - name: Kontrakt TS ⇄ SQL - zasięg ekstrakcji (pełne sprawdzenie w jobie pgtap)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:ts-sql-contract

      - name: Generated Supabase types are not stale vs migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:types-freshness

      - name: Every dangerouslySetInnerHTML goes through the sanitizer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:dangerous-html

      - name: Client IP has exactly one definition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:client-ip-source

      - name: One copy of every stateful package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:module-singletons

      - name: public/ nie przesłania tras
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check:public-assets

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # Keep tests and artifact measurements on the same Node runtime.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `testAccountingReporter` (domyślny reporter z vitest.config.ts) kończy
      # przebieg błędem, gdy proces testowy zginie po cichu i część przypadków
      # nie zwróci wyniku - bez tego taki shard raportowałby zielony log.
      - name: Run test shard
        run: bunx vitest run --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        id: build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      # Cykl w grafie chunków dał na produkcji martwą hydratację - to bramka
      # poprawności, nie wydajności, więc blokuje także PR-y.
      - name: Chunk graph acyclicity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check:chunks

      # Budżety wydajności: tylko main i uruchomienie ręczne.
      - name: Bundle size budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: bun run check:bundle

      - name: Client boot path free of payment SDKs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: bun run check:entry-purity

      - name: Server request graph free of eager server-only SDKs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: bun run check:server-entry-purity

      - name: Install Playwright Chromium
        if: ${{ !cancelled() }}
        run: bunx playwright install --with-deps chromium

      - name: Build production artifact for a node server (smoke preset)
        if: ${{ !cancelled() }}
        run: bun run build:smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      - name: Boot test and first-load timing on the production artifact
        if: ${{ !cancelled() }}
        run: bun run test:e2e:artifact
        env:
          # Dane z fixture (scripts/performance/replayFetch.mjs) zamiast placeholdera:
          # strona główna z hero i sekcjami, jak w pomiarze (playwright.artifact.config.ts).
          NES_ARTIFACT_FIXTURE: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      - name: Upload artifact boot report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-artifact-boot
          path: playwright-report/
          retention-days: 7

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Wersja CLI jest przypięta, bo to ONA wybiera obrazy lokalnego stosu
      # (Postgres i usługi), a `supabase/config.toml` nie ma `[db] major_version`
      # - pływające `latest` po cichu zmieniłoby bazę, na której jadą testy.
      # Pin trzymamy w parze z e2e.yml (job `e2e-seeded`); podbicie CLI dopiero
      # razem z przypięciem `[db] major_version` do wersji produkcji.
      #
      # KOLEJNOŚĆ: setup-cli PRZED setup-bun. Akcja v3 instaluje CLI z npm
      # skryptem uruchamianym na własnym Bunie (1.3.10 z `.bun-version` akcji)
      # i kładzie tego Buna w `~/.bun/bin/bun` - w tym samym miejscu, którego
      # używa setup-bun repo. Wygrywa instalacja późniejsza, więc dopiero
      # setup-bun poniżej zostawia na PATH wersję z `.bun-version` repo.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: "2.111.0"

      # Kontrakt TypeScript ⇄ SQL: wywołania z kodu `src/**` (RPC, tabele,
      # kolumny, literały, cele onConflict, kolumny publiczne) jako test pgTAP
      # na TEJ bazie, którą stawia krok niżej. Plik nie jest w repo - powstaje
      # z bieżącego kodu, więc nie może się zestarzeć.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (generator kontraktu TS ⇄ SQL)
        run: bun install --frozen-lockfile

      - name: Generate TS ⇄ SQL contract test
        run: bun run generate:ts-sql-contract

      - name: Start local database (migrations + seed)
        run: supabase db start

      - name: Install pgTAP extension
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -c 'create extension if not exists pgtap with schema extensions;'

      # Część plików pgTAP wyłącza triggery na auth.users (DISABLE TRIGGER USER),
      # co wymaga właściciela tabeli. Próbujemy kolejno: członkostwo
      # supabase_auth_admin, a potem przekazanie własności; bez tego pliki
      # padną na 42501 (must be owner of table users).
      - name: Allow test role to toggle auth triggers
        run: |
          set -u
          PG_TEST_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          PG_ADMIN_URL="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"
          probe() {
            psql "$PG_TEST_URL" -v ON_ERROR_STOP=1 -q \
              -c 'ALTER TABLE auth.users DISABLE TRIGGER USER;' \
              -c 'ALTER TABLE auth.users ENABLE TRIGGER USER;' >/dev/null 2>&1
          }
          if probe; then
            echo "Rola testowa juz moze przestawiac triggery na auth.users."
            exit 0
          fi
          for url in "$PG_ADMIN_URL" "$PG_TEST_URL"; do
            psql "$url" -v ON_ERROR_STOP=1 -q \
              -c 'GRANT supabase_auth_admin TO postgres;' >/dev/null 2>&1 && break
          done
          if probe; then
            echo "Nadano czlonkostwo supabase_auth_admin roli postgres."
            exit 0
          fi
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -q \
            -c 'ALTER TABLE auth.users OWNER TO postgres;' >/dev/null 2>&1 || true
          if probe; then
            echo "Przekazano wlasnosc auth.users roli postgres."
            exit 0
          fi
          echo "::warning::Rola testowa nie moze przestawiac triggerow na auth.users - pliki pgTAP oparte na DISABLE TRIGGER padna na 42501 (must be owner of table users)."

      - name: Run pgTAP tests
        run: supabase test db

  pg-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install PostgreSQL 16
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-contrib-16
          /usr/lib/postgresql/16/bin/initdb --version

      - name: Run pg-harness (migracje + asercje runtime)
        run: bun run check:pg-harness

      - name: Run careers-harness (migracje + asercje runtime)
        if: ${{ !cancelled() }}
        run: bun run check:careers-harness

      - name: Run events-harness (migracje modulu wydarzen + asercje runtime)
        if: ${{ !cancelled() }}
        run: bun run check:events-harness

      - name: "Run tenant-isolation-harness (RLS: media_mentions / saved_searches / user_follows)"
        if: ${{ !cancelled() }}
        run: bun run check:tenant-isolation

  # Po scaleniu do main: czy produkcyjna baza ma wszystkie tabele, widoki, RPC i kolumny
  # oraz czy migracje z repo zostały na niej faktycznie zastosowane. Bez
  # adresu i klucza Supabase job kończy się ostrzeżeniem zamiast czerwonego
  # statusu, bo nie ma czego sondować. Dane dostępowe to ZMIENNE repozytorium
  # (vars.*): sekret o tej nazwie czytają też build i e2e, które bez niego
  # jadą na zaślepce (docs/RUNBOOK_MIGRACJE_LOVABLE.md §4.8).
  post-deploy:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [release-gate]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require Supabase credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Brak SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY - kontrola produkcyjnej bazy pominięta. Ustaw ZMIENNE repozytorium (vars), nie sekrety: sekret o tej nazwie przełącza build i e2e z zaślepki na produkcję (docs/RUNBOOK_MIGRACJE_LOVABLE.md §4.8)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.creds.outputs.ready == 'true' }}
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: ${{ steps.creds.outputs.ready == 'true' }}
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.creds.outputs.ready == 'true' }}
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: ${{ steps.creds.outputs.ready == 'true' }}
        run: bun install --frozen-lockfile

      - name: Database contract (tables / views / RPC / columns)
        if: ${{ steps.creds.outputs.ready == 'true' }}
        run: bun run check:db-contract

      - name: Migration ledger (branch migrations actually applied)
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' }}
        run: bun run check:migration-ledger

  release-gate:
    name: Required release checks
    if: ${{ !cancelled() }}
    needs: [verify, test-shards, build, pgtap, pg-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const checks=JSON.parse(process.env.CHECK_RESULTS); if(Object.values(checks).some(check=>check.result!=="success")) process.exit(1)'
