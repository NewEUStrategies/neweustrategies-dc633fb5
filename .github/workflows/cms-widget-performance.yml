name: CMS widget performance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cms-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cms-widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [builder, blocks]
        variant: [text, form]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies and Chromium
        run: |
          cd candidate
          bun install --frozen-lockfile
          cd ..
          ln -s ../candidate/node_modules harness/node_modules
          cd harness
          bunx playwright install --with-deps chromium
          bun run test:cms-performance-harness
      - name: Build baseline production artifact
        working-directory: baseline
        run: |
          bun install --frozen-lockfile
          bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Measure baseline - 24 independent samples
        id: measure_baseline
        # Collect candidate diagnostics even when the historical version fails.
        # The final step still fails the job for a failed baseline.
        continue-on-error: true
        working-directory: harness
        run: bun run test:e2e:cms-performance ${{ matrix.engine }} ${{ matrix.variant }}
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/baseline
          NES_PERFORMANCE_BASELINE: "1"
      - name: Preserve baseline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cms-baseline-${{ matrix.engine }}-${{ matrix.variant }}
          path: |
            harness/reports/cms-widgets/
            harness/reports/cms-playwright/
            harness/test-results-cms-performance/
          retention-days: 14
      - name: Move completed baseline samples
        working-directory: harness
        run: mv reports/cms-widgets reports/cms-widgets-baseline
      - name: Build candidate production artifact
        working-directory: candidate
        run: bun run build:smoke
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4199
          VITE_SUPABASE_PUBLISHABLE_KEY: performance-fixture
      - name: Measure candidate - 24 independent samples
        id: measure_candidate
        working-directory: harness
        run: bun run test:e2e:cms-performance ${{ matrix.engine }} ${{ matrix.variant }}
        env:
          NES_PERFORMANCE_ARTIFACT_ROOT: ${{ github.workspace }}/candidate
          NES_PERFORMANCE_BASELINE: "0"
      - name: Compare equivalent samples
        working-directory: harness
        run: node scripts/performance/compare-cms-widgets.mjs ${{ matrix.engine }} ${{ matrix.variant }}
      - name: Require baseline correctness
        if: ${{ !cancelled() && steps.measure_baseline.outcome == 'failure' }}
        run: exit 1
      - name: Preserve candidate and comparison evidence
        if: ${{ !cancelled() && steps.measure_candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cms-candidate-${{ matrix.engine }}-${{ matrix.variant }}
          path: |
            harness/reports/cms-widgets/
            harness/reports/cms-comparison-*.json
            harness/reports/cms-playwright/
            harness/test-results-cms-performance/
          retention-days: 14
